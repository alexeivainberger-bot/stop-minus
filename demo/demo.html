<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Стоп-минус — демо</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>

<header class="top">
  <div class="brand">
    Стоп-минус
    <span class="tag">демо-страница</span>
  </div>
  <div class="note">Имитация таблицы «Цены и скидки». Оверлей считает маржу локально — тот же код, что пойдёт в расширение.</div>
</header>

<section class="settings">
  <div class="settings-title">Параметры расчёта</div>
  <div class="settings-grid">
    <label>Комиссия, %<input id="s-commission" type="number" step="0.1" min="0" max="100"></label>
    <label>Налог, %<input id="s-tax" type="number" step="0.1" min="0" max="100"></label>
    <label>Порог маржи, %<input id="s-threshold" type="number" step="1" min="0" max="100"></label>
    <label>Логистика, ₽<input id="s-logistics" type="number" step="1" min="0"></label>
    <label>Упаковка, ₽<input id="s-packaging" type="number" step="1" min="0"></label>
    <label>Возврат, ₽<input id="s-return" type="number" step="1" min="0"></label>
    <label>Выкуп, %<input id="s-buyout" type="number" step="1" min="0" max="100"></label>
    <label>Прочие, ₽<input id="s-other" type="number" step="1" min="0"></label>
    <label>Скидка акции, %<input id="s-promo" type="number" step="1" min="0" max="100"></label>
  </div>
</section>

<main>
  <div class="summary" id="summary" hidden></div>

  <div class="page-head">
    <h1>Цены и скидки</h1>
    <div class="actions">
      <button id="btn-add-row">+ Добавить строку</button>
      <button id="btn-auto" class="secondary">Авто-режим</button>
      <button id="btn-manual" class="secondary">Ручной режим</button>
      <button id="btn-calibrate" class="secondary">Калибровка</button>
      <button id="btn-reset" class="ghost">Сбросить к примеру</button>
    </div>
  </div>

  <table class="price-table">
    <thead>
      <tr>
        <th>Артикул</th>
        <th>Наименование</th>
        <th>Себестоимость</th>
        <th>Цена, ₽</th>
        <th>Скидка</th>
      </tr>
    </thead>
    <tbody>
      <tr data-sku="123456" data-cost="620">
        <td class="mono"><input class="art-input" data-wbmg-ignore="1" type="text" inputmode="numeric" value="123456"></td>
        <td><input class="name-input" data-wbmg-ignore="1" type="text" value="Футболка oversize, чёрная"></td>
        <td class="num"><input class="cost-input" data-wbmg-ignore="1" type="text" inputmode="decimal" value="620"></td>
        <td><input class="price-input" type="text" inputmode="decimal" placeholder="Цена, ₽" value="1990"></td>
        <td class="num muted">0% <button type="button" class="row-del" title="Удалить строку">✕</button></td>
      </tr>
      <tr data-sku="234567" data-cost="1100">
        <td class="mono"><input class="art-input" data-wbmg-ignore="1" type="text" inputmode="numeric" value="234567"></td>
        <td><input class="name-input" data-wbmg-ignore="1" type="text" value="Худи с начёсом, серое"></td>
        <td class="num"><input class="cost-input" data-wbmg-ignore="1" type="text" inputmode="decimal" value="1100"></td>
        <td><input class="price-input" type="text" inputmode="decimal" placeholder="Цена, ₽" value="2990"></td>
        <td class="num muted">0% <button type="button" class="row-del" title="Удалить строку">✕</button></td>
      </tr>
      <tr data-sku="345678" data-cost="150">
        <td class="mono"><input class="art-input" data-wbmg-ignore="1" type="text" inputmode="numeric" value="345678"></td>
        <td><input class="name-input" data-wbmg-ignore="1" type="text" value="Носки, комплект 5 пар"></td>
        <td class="num"><input class="cost-input" data-wbmg-ignore="1" type="text" inputmode="decimal" value="150"></td>
        <td><input class="price-input" type="text" inputmode="decimal" placeholder="Цена, ₽" value="390"></td>
        <td class="num muted">0% <button type="button" class="row-del" title="Удалить строку">✕</button></td>
      </tr>
    </tbody>
  </table>
</main>

<script src="../src/calc.js?v=1.5.0"></script>
<script src="../src/store.js?v=1.5.0"></script>
<script src="../src/overlay.js?v=1.5.0"></script>
<script src="../src/engine.js?v=1.5.0"></script>
<script src="demo.js?v=1.5.0"></script>
</body>
</html>
